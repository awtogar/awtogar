<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Awaluddin Togar. A Creative Engineer.">
  <style>
    .rise { animation: rise 900ms cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: 100ms; }
    .d2 { animation-delay: 250ms; }
    .d3 { animation-delay: 400ms; }
    .rule { transform-box: fill-box; transform-origin: left center; animation: draw 1200ms cubic-bezier(.65,0,.35,1) 500ms both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .rule { animation: none; }
    }
  </style>
  <rect width="1200" height="300" fill="#0c0c0c"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text class="rise d1" x="60" y="62" font-size="14" letter-spacing="3" fill="#d0d7de">Hello There! im,</text>
    <text class="rise d2" x="60" y="172" font-size="76" font-weight="600" letter-spacing="-2.5" fill="#ffffff">Awaluddin Togar</text>
    <text class="rise d3" x="62" y="226" font-size="24" fill="#ffffff">a Creative Engineer</text>
  </g>

